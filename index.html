<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>IRONLOG</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IRONLOG">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='%23000000'/><path d='M140 256h232M170 190v132M342 190v132M205 210v92M307 210v92' stroke='%2330d158' stroke-width='34' stroke-linecap='round'/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-inner: #2c2c2e;
      --border: #38383a;
      --accent: #30d158;
      --accent-dim: rgba(48, 209, 88, 0.15);
      --text: #ffffff;
      --text-sec: #8e8e93;
      --danger: #ff453a;
      --radius: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      padding: calc(env(safe-area-inset-top, 20px) + 8px) 16px calc(env(safe-area-inset-bottom, 20px) + 80px) 16px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    /* ШАПКА */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 8px 4px 16px;
    }
    .header-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: -0.2px;
    }
    .header-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .header-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    /* МИНИМАЛИСТИЧНЫЕ КАРТОЧКИ */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* СЕТКА СТАТИСТИКИ */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat-pill {
      background: var(--card-inner);
      padding: 12px 6px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .stat-pill-val {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-pill-lbl {
      font-size: 11px;
      color: var(--text-sec);
      margin-top: 2px;
    }

    /* ПОЛЯ ВВОДА В СТИЛЕ IOS */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    input, textarea, select {
      width: 100%;
      background: var(--card-inner);
      border: none;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    input[type="date"] {
      min-height: 44px;
      color: var(--text);
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder {
      color: var(--text-sec);
    }

    /* КНОПКИ */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #000000;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:active {
      opacity: 0.7;
    }
    .btn-secondary {
      background: var(--card-inner);
      color: var(--text);
    }
    .btn-danger {
      background: rgba(255, 69, 58, 0.15);
      color: var(--danger);
    }

    /* УПРАЖНЕНИЯ И СИСТЕМНЫЕ КРУГЛЫЕ ЧЕКБОКСЫ */
    .ex-box {
      background: var(--card-inner);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 10px;
    }
    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .ex-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .ex-progress {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
    }
    .set-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 0.5px solid rgba(255, 255, 255, 0.08);
    }
    .set-text {
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .set-row.done .set-text {
      color: var(--text-sec);
      text-decoration: line-through;
    }
    .ios-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .set-row.done .ios-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .ios-check::after {
      content: "✓";
      color: #000000;
      font-size: 14px;
      font-weight: 900;
      display: none;
    }
    .set-row.done .ios-check::after {
      display: block;
    }

    /* НАВИГАЦИЯ В СТИЛЕ IOS ТАБ-БАРА */
    nav.tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(50px + env(safe-area-inset-bottom, 0px));
      background: rgba(28, 28, 30, 0.88);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 0.5px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: space-around;
      padding-top: 4px;
      z-index: 1000;
    }
    .tab-item {
      background: none;
      border: none;
      color: var(--text-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 500;
      width: 25%;
    }
    .tab-item.active {
      color: var(--accent);
    }
    .tab-icon {
      font-size: 20px;
    }

    .screen { display: none; }
    .screen.active { display: block; }
    .chart-container { position: relative; height: 210px; width: 100%; }
    .timer-digital {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin: 20px 0;
    }
  </style>
</head>


<body>

  <header>
    <div>
      <div class="header-date" id="topDateStr">Четверг, 29 октября</div>
      <div class="header-title">IRONLOG</div>
    </div>
    <div class="header-badge" id="topWeightBadge">82.0 кг</div>
  </header>

  <!-- ЭКРАН 1: СЕГОДНЯ (ОТОБРАЖАЕТСЯ ТОЛЬКО ПОСЛЕ ЗАГРУЗКИ) -->
  <section id="screen-today" class="screen active">
    
    <!-- КАРТОЧКА ИМПОРТА (ПОКАЗЫВАЕТСЯ ВСЕГДА ДЛЯ ВВОДА ПЛАНА) -->
    <div class="card">
      <div class="card-title">
        <span>Добавить тренировку</span>
      </div>
      <textarea id="planInput" rows="3" placeholder="Вставьте текст: Жим 105 1/6, Присед 115 5/5..."></textarea>
      <button class="btn" style="margin-top: 10px;" onclick="parseAndSavePlan()">Записать на сегодня</button>
    </div>

    <!-- ТРЕНИРОВКА ТЕКУЩЕГО ДНЯ -->
    <div class="card">
      <div class="card-title">
        <span>План на сегодня</span>
        <span id="sessionVolume" style="font-size: 13px; color: var(--accent);">0 кг</span>
      </div>
      
      <div id="todayList">
        <!-- Сюда динамически рендерится список упражнений с чекбоксами -->
      </div>

      <div id="clearDayBtnBox" style="display: none; margin-top: 14px;">
        <button class="btn btn-danger" onclick="clearToday()">Очистить план на сегодня</button>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 2: ТАЙМЕР ОТДЫХА -->
  <section id="screen-timer" class="screen">
    <div class="card" style="text-align: center; padding: 24px 16px;">
      <div class="card-title" style="justify-content: center;">Отдых между подходами</div>
      <div class="timer-digital" id="timerCount">01:30</div>
      <div class="input-grid">
        <button class="btn" id="timerStartBtn" onclick="toggleTimer()">Старт</button>
        <button class="btn btn-secondary" onclick="resetTimer(90)">90 сек</button>
      </div>
      <div class="input-grid" style="margin-top: 8px;">
        <button class="btn btn-secondary" onclick="addTimerSeconds(30)">+30 сек</button>
        <button class="btn btn-secondary" onclick="resetTimer(120)">120 сек</button>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 3: ЗАМЕРЫ И АНТРОПОМЕТРИЯ -->
  <section id="screen-measurements" class="screen">
    <div class="card">
      <div class="card-title">Внести замер</div>
      <div style="margin-bottom: 10px;">
        <input type="date" id="mDate">
      </div>
      <div class="input-grid">
        <input type="number" step="0.1" id="mWeight" placeholder="Вес тела (кг)">
        <input type="number" step="0.5" id="mWaist" placeholder="Талия (см)">
      </div>
      <div class="input-grid">
        <input type="number" step="0.5" id="mChest" placeholder="Грудная клетка (см)">
        <input type="number" step="0.5" id="mThigh" placeholder="Бедро (см)">
      </div>
      <div style="margin-bottom: 10px;">
        <input type="number" step="0.5" id="mArm" placeholder="Обхват плеча / бицепс (см)">
      </div>
      <button class="btn" onclick="saveMeasurement()">Сохранить параметры</button>
    </div>

    <div class="card">
      <div class="card-title">Динамика веса тела</div>
      <div class="chart-container">
        <canvas id="chartWeight"></canvas>
      </div>
    </div>
  </section>

  <!-- ЭКРАН 4: СТАТИСТИКА И БЭКАП -->
  <section id="screen-analytics" class="screen">
    <div class="card">
      <div class="card-title">Общая сводка</div>
      <div class="stat-row">
        <div class="stat-pill">
          <div class="stat-pill-val" id="totalSessionsCount">0</div>
          <div class="stat-pill-lbl">сессий</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-val" id="totalExercisesCount">0</div>
          <div class="stat-pill-lbl">упражнений</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-val" id="totalMeasurementsCount">0</div>
          <div class="stat-pill-lbl">замеров</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Прогресс упражнения</div>
      <select id="exerciseSelect" onchange="renderExerciseChart()" style="margin-bottom: 12px;"></select>
      <div class="chart-container">
        <canvas id="chartExercise"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Резервная копия</div>
      <p style="color: var(--text-sec); font-size: 13px; margin-bottom: 12px;">Сохраните JSON-файл в приложение «Файлы» (iCloud Drive).</p>
      <div class="input-grid">
        <button class="btn btn-secondary" onclick="exportDataJson()">Экспорт JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Импорт JSON</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importDataJson(event)">
    </div>
  </section>

  <!-- НАВИГАЦИОННАЯ ПАНЕЛЬ -->
  <nav class="tab-bar">
    <button class="tab-item active" onclick="switchTab('today', this)">
      <span class="tab-icon">🏋️</span>Сегодня
    </button>
    <button class="tab-item" onclick="switchTab('timer', this)">
      <span class="tab-icon">⏱</span>Таймер
    </button>
    <button class="tab-item" onclick="switchTab('measurements', this)">
      <span class="tab-icon">⚖️</span>Замеры
    </button>
    <button class="tab-item" onclick="switchTab('analytics', this)">
      <span class="tab-icon">📊</span>Анализ
    </button>
  </nav>


  <script>
    const STORAGE_KEY = "ironlog_db_v1";

    function defaultData() {
      return { unit: "кг", entries: [], measurements: [] };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaultData(), ...JSON.parse(raw) } : defaultData();
      } catch (e) {
        return defaultData();
      }
    }

    let data = loadData();
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateUI();
    }

    function dateKey(val) {
      const d = new Date(val);
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
      ].join("-");
    }

    // ПАРСЕР ТЕКСТА
    function parseSingleItem(rawContent) {
      let text = String(rawContent || "").trim()
        .replace(/^\s*[-*•]\s*/, "")
        .replace(/^\s*\d+[.)]\s*/, "")
        .replace(/^\s*\[[ xX]?\]\s*/, "")
        .replace(/[·]/g, " ")
        .replace(/\bкг\b/gi, "")
        .replace(/\bkg\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      if (!text || text.length < 2) return null;
      if (/^(понедельник|вторник|среда|четверг|пятница|суббота|воскресенье)$/i.test(text)) return null;

      // Формат: Шраги 4/20 60
      const reverseFormat = text.match(/^(.+?)\s+(\d+)\s*[\/xх*]\s*(\d+)\s+(\d+(?:[.,]\d+)?)(?:\s+.*)?$/i);
      if (reverseFormat) {
        const name = reverseFormat[1].trim();
        const sets = parseInt(reverseFormat[2], 10);
        const reps = parseInt(reverseFormat[3], 10);
        const weight = parseFloat(reverseFormat[4].replace(",", "."));
        return { name, setsData: Array.from({ length: sets }, () => ({ weight, reps, done: false })) };
      }

      // Формат: Жим 80 4/6
      const multiRegex = /(\d+(?:[.,]\d+)?)\s+(\d+)\s*[\/xх*]\s*(\d+)/g;
      const blocks = [];
      let block;
      while ((block = multiRegex.exec(text)) !== null) {
        blocks.push({
          weight: parseFloat(block[1].replace(",", ".")),
          sets: parseInt(block[2], 10),
          reps: parseInt(block[3], 10)
        });
      }

      if (blocks.length > 0) {
        const name = text.slice(0, text.search(/(\d+(?:[.,]\d+)?)\s+(\d+)\s*[\/xх*]\s*(\d+)/)).trim();
        const setsData = [];
        for (const b of blocks) {
          for (let i = 0; i < b.sets; i++) setsData.push({ weight: b.weight, reps: b.reps, done: false });
        }
        return { name: name || text, setsData };
      }

      // Формат: Пресс 4*20
      const setsFirst = text.match(/^(.+?)\s+(\d+)\s*[\/xх*]\s*(\d+)(?:\s+(\d+(?:[.,]\d+)?))?$/);
      if (setsFirst) {
        const name = setsFirst[1].trim();
        const sets = parseInt(setsFirst[2], 10);
        const reps = parseInt(setsFirst[3], 10);
        const weight = setsFirst[4] ? parseFloat(setsFirst[4].replace(",", ".")) : 0;
        return { name, setsData: Array.from({ length: sets }, () => ({ weight, reps, done: false })) };
      }

      return null;
    }

    // ИМПОРТ ПЛАНА СТРОГО НА ТЕКУЩУЮ ДАТУ
    function parseAndSavePlan() {
      const input = document.getElementById("planInput").value.trim();
      if (!input) return;
      const lines = input.split(/\r?\n|;/).map(l => l.trim()).filter(Boolean);
      const todayIso = new Date().toISOString();

      for (const line of lines) {
        const item = parseSingleItem(line);
        if (item && item.name) {
          data.entries.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            date: todayIso, // Привязываем строго к моменту добавления
            exercise: item.name,
            setsData: item.setsData
          });
        }
      }

      document.getElementById("planInput").value = "";
      saveData();
    }

    // НАЖАТИЕ НА КРУГЛЫЙ ЧЕКБОКС + АВТОСТАРТ ТАЙМЕРА
    function toggleSetDone(entryId, setIndex) {
      const entry = data.entries.find(e => e.id === entryId);
      if (!entry || !entry.setsData[setIndex]) return;

      const isDone = !entry.setsData[setIndex].done;
      entry.setsData[setIndex].done = isDone;
      saveData();

      // Автоматический запуск отдыха при завершении подхода
      if (isDone) {
        resetTimer(90);
        toggleTimer();
      }
    }

    function clearToday() {
      if (!confirm("Удалить план и подходы за сегодняшний день?")) return;
      const today = dateKey(new Date());
      data.entries = data.entries.filter(e => dateKey(e.date) !== today);
      saveData();
    }


    // МОДУЛЬ ТАЙМЕРА
    let timerInterval = null;
    let timerSec = 90;

    function renderTimer() {
      const m = String(Math.floor(timerSec / 60)).padStart(2, "0");
      const s = String(timerSec % 60).padStart(2, "0");
      document.getElementById("timerCount").innerText = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById("timerStartBtn");
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = "Старт";
      } else {
        btn.innerText = "Пауза";
        timerInterval = setInterval(() => {
          if (timerSec > 0) {
            timerSec--;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            timerInterval = null;
            btn.innerText = "Старт";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            alert("Время отдыха вышло! Пора на подход 💪");
          }
        }, 1000);
      }
    }

    function resetTimer(sec) {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timerSec = sec;
      document.getElementById("timerStartBtn").innerText = "Старт";
      renderTimer();
    }

    function addTimerSeconds(sec) {
      timerSec += sec;
      renderTimer();
    }

    // МОДУЛЬ ЗАМЕРОВ
    function saveMeasurement() {
      const chosenDate = document.getElementById("mDate").value || dateKey(new Date());
      const weight = parseFloat(document.getElementById("mWeight").value) || 0;
      const waist = parseFloat(document.getElementById("mWaist").value) || 0;
      const chest = parseFloat(document.getElementById("mChest").value) || 0;
      const thigh = parseFloat(document.getElementById("mThigh").value) || 0;
      const arm = parseFloat(document.getElementById("mArm").value) || 0;

      if (!weight && !waist && !chest && !thigh && !arm) {
        alert("Заполните хотя бы один параметр");
        return;
      }

      const existingIdx = data.measurements.findIndex(m => dateKey(m.date) === chosenDate);
      const record = {
        id: Date.now().toString(36),
        date: new Date(chosenDate + "T12:00:00").toISOString(),
        weight, waist, chest, thigh, arm
      };

      if (existingIdx !== -1) {
        data.measurements[existingIdx] = record;
      } else {
        data.measurements.push(record);
      }

      data.measurements.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveData();
      alert("Параметры зафиксированы!");
    }

    // ГРАФИКИ
    let weightChartInstance = null;
    let exerciseChartInstance = null;

    function renderBodyCharts() {
      const m = data.measurements || [];
      const labels = m.map(x => dateKey(x.date).slice(5));
      const weights = m.map(x => x.weight || null);

      const ctx = document.getElementById("chartWeight").getContext("2d");
      if (weightChartInstance) weightChartInstance.destroy();
      weightChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            data: weights,
            borderColor: "#30d158",
            backgroundColor: "rgba(48, 209, 88, 0.12)",
            borderWidth: 2.5,
            tension: 0.3,
            fill: true,
            pointRadius: 4,
            pointBackgroundColor: "#30d158"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8e8e93", font: { size: 10 } }, grid: { color: "#2c2c2e" } },
            y: { ticks: { color: "#8e8e93", font: { size: 10 } }, grid: { color: "#2c2c2e" } }
          }
        }
      });
    }

    function updateExerciseSelect() {
      const sel = document.getElementById("exerciseSelect");
      const names = [...new Set(data.entries.map(e => e.exercise))].sort((a, b) => a.localeCompare(b, "ru"));
      const cur = sel.value;
      sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (names.includes(cur)) sel.value = cur;
      renderExerciseChart();
    }

    function renderExerciseChart() {
      const sel = document.getElementById("exerciseSelect");
      const name = sel.value;
      if (!name) return;

      const history = data.entries.filter(e => e.exercise === name).sort((a, b) => new Date(a.date) - new Date(b.date));
      const labels = history.map(e => dateKey(e.date).slice(5));
      const maxWeights = history.map(e => Math.max(0, ...(e.setsData || []).map(s => Number(s.weight) || 0)));

      const ctx = document.getElementById("chartExercise").getContext("2d");
      if (exerciseChartInstance) exerciseChartInstance.destroy();
      exerciseChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Макс вес (кг)",
            data: maxWeights,
            borderColor: "#30d158",
            backgroundColor: "rgba(48, 209, 88, 0.15)",
            borderWidth: 2,
            tension: 0.25,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#8e8e93" } } },
          scales: {
            x: { ticks: { color: "#8e8e93" }, grid: { color: "#2c2c2e" } },
            y: { ticks: { color: "#8e8e93" }, grid: { color: "#2c2c2e" } }
          }
        }
      });
    }

    // ОБНОВЛЕНИЕ ЭКРАНОВ С ПРОВЕРКОЙ ТЕКУЩЕЙ ДАТЫ
    function updateUI() {
      const today = dateKey(new Date());

      // Дата в шапке
      const now = new Date();
      const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById("topDateStr").innerText = now.toLocaleDateString('ru-RU', dateOptions);

      // Последний замер веса
      const lastM = data.measurements[data.measurements.length - 1];
      document.getElementById("topWeightBadge").innerText = lastM && lastM.weight ? `${lastM.weight} кг` : "— кг";

      // Сводка
      const uniqueDays = new Set(data.entries.map(e => dateKey(e.date)));
      document.getElementById("totalSessionsCount").innerText = uniqueDays.size;
      document.getElementById("totalExercisesCount").innerText = data.entries.length;
      document.getElementById("totalMeasurementsCount").innerText = data.measurements.length;

      // ТРЕНИРОВКА ТОЛЬКО НА СЕГОДНЯ: фильтруем строго по dateKey(e.date) === today
      const todayEntries = data.entries.filter(e => dateKey(e.date) === today);
      let vol = 0;
      let totalSets = 0;
      let doneSets = 0;

      todayEntries.forEach(e => {
        (e.setsData || []).forEach(s => {
          totalSets++;
          if (s.done) doneSets++;
          vol += (Number(s.weight) || 0) * (Number(s.reps) || 0);
        });
      });

      document.getElementById("sessionVolume").innerText = `${vol} кг · ${doneSets}/${totalSets}`;

      const list = document.getElementById("todayList");
      if (!todayEntries.length) {
        list.innerHTML = `<p style="color: var(--text-sec); font-size: 14px; text-align: center; padding: 16px 0;">На сегодня тренировка ещё не добавлена.<br>Вставьте текст выше, чтобы начать.</p>`;
        document.getElementById("clearDayBtnBox").style.display = "none";
      } else {
        document.getElementById("clearDayBtnBox").style.display = "block";
        list.innerHTML = todayEntries.map((e, idx) => {
          const sets = e.setsData || [];
          const allDone = sets.length > 0 && sets.every(s => s.done);

          const setsHtml = sets.map((s, sIdx) => `
            <div class="set-row ${s.done ? 'done' : ''}">
              <div class="set-text">${sIdx + 1} подход: ${s.weight} кг × ${s.reps}</div>
              <button class="ios-check" onclick="toggleSetDone('${e.id}', ${sIdx})"></button>
            </div>
          `).join("");

          return `
            <div class="ex-box">
              <div class="ex-header">
                <div class="ex-name">${idx + 1}. ${e.exercise}</div>
                <div class="ex-progress">${allDone ? '✅ Сделано' : `${sets.filter(s=>s.done).length}/${sets.length}`}</div>
              </div>
              <div>${setsHtml}</div>
            </div>
          `;
        }).join("");
      }

      updateExerciseSelect();
      renderBodyCharts();
    }

    function switchTab(screenId, btn) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.querySelectorAll(".tab-item").forEach(b => b.classList.remove("active"));
      document.getElementById(`screen-${screenId}`).classList.add("active");
      if (btn) btn.classList.add("active");

      if (screenId === "measurements") setTimeout(renderBodyCharts, 40);
      if (screenId === "analytics") setTimeout(renderExerciseChart, 40);
    }

    // ИМПОРТ / ЭКСПОРТ JSON
    function exportDataJson() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ironlog-backup.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDataJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed.entries)) {
            data = { ...defaultData(), ...parsed };
            saveData();
            alert("Данные успешно импортированы!");
          }
        } catch (err) {
          alert("Некорректный файл");
        }
      };
      reader.readAsText(file);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    document.getElementById("mDate").value = dateKey(new Date());
    updateUI();
    renderTimer();
  </script>
</body>
</html>
